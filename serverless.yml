service: aws-serverless-poc

frameworkVersion: "3"

plugins:
  - serverless-plugin-typescript
  - serverless-offline

provider:
  name: aws
  runtime: nodejs16.x
  region: eu-central-1
  environment:
    TASKS_TABLE: ${self:service}-tasks-${sls:stage}
    USER2_NOTIFICATION_QUEUE: ${self:service}-user2-notifications-${sls:stage}
    USER2_TASK_QUEUE: ${self:service}-user2-tasks-${sls:stage}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:DeleteItem
      Resource: !GetAtt TasksTable.Arn
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource:
        - !GetAtt User2NotificationQueue.Arn
        - !GetAtt User2TaskQueue.Arn
    - Effect: Allow
      Action:
        - states:StartExecution
      Resource: "*"

# Add package configuration
package:
  individually: true

functions:
  # User-1 functions
  createTask:
    handler: functions/user1/createTask.handler
    events:
      - http:
          path: tasks
          method: post

  getTask:
    handler: functions/user1/getTask.handler
    events:
      - http:
          path: tasks/{id}
          method: get

  updateTask:
    handler: functions/user1/updateTask.handler
    events:
      - http:
          path: tasks/{id}
          method: put

  # User-2 functions
  createRandomTasksForUser1:
    handler: functions/user2/createRandomTasks.handler
    events:
      - http:
          path: user2/tasks/random
          method: post

  getAllTasksForUser1:
    handler: functions/user2/getAllTasks.handler
    events:
      - http:
          path: user2/tasks
          method: get

  deleteAllTasksForUser1:
    handler: functions/user2/deleteAllTasks.handler
    events:
      - http:
          path: user2/tasks
          method: delete

  notifyTaskCreation:
    handler: functions/user2/notifyTaskCreation.handler
    events:
      - sqs:
          arn: !GetAtt User2TaskQueue.Arn
          batchSize: 10

resources:
  Resources:
    TasksTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TASKS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    User2NotificationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.environment.USER2_NOTIFICATION_QUEUE}
        MessageRetentionPeriod: 1209600 # 14 days in seconds
        VisibilityTimeout: 60

    User2TaskQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.environment.USER2_TASK_QUEUE}
        MessageRetentionPeriod: 1209600 # 14 days in seconds
        VisibilityTimeout: 60
